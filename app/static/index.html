<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DoorIQ</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="intro-panel" aria-label="DoorIQ overview">
        <div class="brand-mark">D</div>
        <p class="eyebrow">United Doors & Hardware</p>
        <h1>DoorIQ Assistant</h1>
        <p class="intro-copy">Ask about commercial doors, frames, hardware, fire ratings, ADA, egress, maglocks, and operators.</p>

        <div class="status-line">
          <span class="status-dot"></span>
          <span>Ready to help</span>
        </div>

        <details class="context-drawer">
          <summary>Project details</summary>
          <div class="context-grid">
            <label>
              Building type
              <select id="buildingType">
                <option value="">Not sure</option>
                <option>hospital</option>
                <option>school</option>
                <option>healthcare</option>
                <option>office</option>
                <option>warehouse</option>
              </select>
            </label>
            <label>
              Opening
              <input id="application" placeholder="corridor, kitchen, entrance" />
            </label>
            <label>
              State
              <input id="state" placeholder="TX" maxlength="2" />
            </label>
            <label>
              ZIP
              <input id="zipCode" placeholder="77002" />
            </label>
          </div>
          <div class="toggle-row">
            <label><input id="egressPath" type="checkbox" /> Egress</label>
            <label><input id="ratedOpening" type="checkbox" /> Rated</label>
            <label><input id="accessibleRoute" type="checkbox" /> Accessible</label>
          </div>
        </details>
      </section>

      <section class="chat-card" aria-label="DoorIQ chat">
        <header class="chat-header">
          <div>
            <p class="eyebrow">DoorIQ</p>
            <h2>Door & hardware guidance</h2>
          </div>
          <button id="resetButton" class="icon-button" type="button" aria-label="Start a new chat" title="Start a new chat">
            New
          </button>
        </header>

        <div id="quickPrompts" class="quick-prompts" aria-label="Example questions"></div>

        <div id="messages" class="messages" aria-live="polite">
          <article class="message assistant">
            <p>Hi, how can I help you?</p>
          </article>
        </div>

        <form id="chatForm" class="composer">
          <textarea id="messageInput" rows="1" placeholder="Ask about a door, frame, hardware, ADA, egress, or fire rating"></textarea>
          <button id="sendButton" type="submit">Send</button>
        </form>

        <div class="sr-only" aria-hidden="true">
          <span id="sessionId">New</span>
          <span id="confidence">-</span>
          <span id="leadState">Not needed</span>
          <span id="intent">Intent</span>
          <span id="flags"></span>
          <span id="missingInfo"></span>
          <span id="products"></span>
          <span id="sources"></span>
        </div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
